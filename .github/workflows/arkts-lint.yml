name: arkts-lint

# Run on push to main, on PRs, and manual dispatch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for same branch on new push
concurrency:
  group: arkts-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Unit tests (Node's built-in test runner) ───
  test:
    name: Unit tests (arkts-lint v0.3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/arkts-lint/package.json

      - name: Install dependencies
        working-directory: scripts/arkts-lint
        run: npm ci

      - name: Run rule table validation
        working-directory: scripts/arkts-lint
        run: npm run check-rules

      - name: Run unit tests
        working-directory: scripts/arkts-lint
        run: npm test

  # ─── Job 2: AST lint (v0.3) �?fails build on errors ───
  lint-ast:
    name: Lint (arkts-lint v0.3 AST)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/arkts-lint/package.json

      - name: Install dependencies
        working-directory: scripts/arkts-lint
        run: npm ci

      - name: Run AST lint (must exit 0)
        # Scan from the REPO ROOT, not from scripts/arkts-lint/.
        # The script uses process.cwd() to find files, so working-directory matters.
        # The script auto-skips its own fixtures and tests via path-based exclusion.
        run: node scripts/arkts-lint/index.mjs --quiet

  # ─── Job 3: Regex lint (v1) �?for backwards compat ───
  lint-regex:
    name: Lint (v1 regex, reference)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No npm cache for v1 (no package.json in scripts/)

      - name: Run regex lint
        run: node scripts/audit-arkts-strict.mjs --quiet